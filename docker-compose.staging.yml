# Staging Environment Docker Compose Configuration
# This configuration mirrors production as closely as possible

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: fiberloop-nginx-staging
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d/staging.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - fiberloop-network
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
      - reverb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PHP Application with Laravel Octane
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: staging
    container_name: fiberloop-app-staging
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/staging.ini:/usr/local/etc/php/conf.d/staging.ini
    networks:
      - fiberloop-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_URL=https://staging.fiberloop.com
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=fiberloop_staging
      - DB_USERNAME=fiberloop
      - DB_PASSWORD=staging_password_change_me
      - RADIUS_DB_HOST=postgres
      - RADIUS_DB_PORT=5432
      - RADIUS_DB_DATABASE=fiberloop_radius_staging
      - RADIUS_DB_USERNAME=fiberloop_radius
      - RADIUS_DB_PASSWORD=staging_radius_password_change_me
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - BROADCAST_CONNECTION=redis
    expose:
      - "9000"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Laravel Reverb for WebSockets
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiberloop-reverb-staging
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - fiberloop-network
    depends_on:
      - redis
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      - APP_ENV=staging
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:8080"

  # PostgreSQL 18
  postgres:
    image: postgres:18-alpine
    container_name: fiberloop-postgres-staging
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fiberloop_staging
      - POSTGRES_USER=fiberloop
      - POSTGRES_PASSWORD=staging_password_change_me
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --data-checksums
    volumes:
      - postgres_data_staging:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/staging:/docker-entrypoint-initdb.d/staging
    networks:
      - fiberloop-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiberloop -d fiberloop_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB

  # Redis
  redis:
    image: redis:7-alpine
    container_name: fiberloop-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_staging:/data
    networks:
      - fiberloop-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FreeRADIUS 3.2.x
  freeradius:
    image: freeradius/freeradius-server:3.2.10
    container_name: fiberloop-freeradius-staging
    restart: unless-stopped
    networks:
      - fiberloop-network
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "18120:18120"
    volumes:
      - ./docker/freeradius:/etc/freeradius
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "freeradius -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Queue worker (Horizon)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiberloop-horizon-staging
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - fiberloop-network
    depends_on:
      - app
      - redis
    command: php artisan horizon
    environment:
      - APP_ENV=staging
      - DB_HOST=postgres
      - DB_DATABASE=fiberloop_staging
      - DB_USERNAME=fiberloop
      - DB_PASSWORD=staging_password_change_me
      - REDIS_HOST=redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Queue worker for low priority
  queue-low:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiberloop-queue-low-staging
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - fiberloop-network
    depends_on:
      - app
      - redis
    command: php artisan queue:work --queue=low --sleep=5 --tries=3 --timeout=300
    environment:
      - APP_ENV=staging
      - DB_HOST=postgres
      - DB_DATABASE=fiberloop_staging
      - DB_USERNAME=fiberloop
      - DB_PASSWORD=staging_password_change_me
      - REDIS_HOST=redis
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M

  # Queue worker for high priority
  queue-high:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiberloop-queue-high-staging
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - fiberloop-network
    depends_on:
      - app
      - redis
    command: php artisan queue:work --queue=high --sleep=1 --tries=5 --timeout=120
    environment:
      - APP_ENV=staging
      - DB_HOST=postgres
      - DB_DATABASE=fiberloop_staging
      - DB_USERNAME=fiberloop
      - DB_PASSWORD=staging_password_change_me
      - REDIS_HOST=redis
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  # Python AI Service
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fiberloop-ai-staging
    restart: unless-stopped
    networks:
      - fiberloop-network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=staging
      - DATABASE_URL=postgresql://fiberloop:staging_password_change_me@postgres:5432/fiberloop_staging
    deploy:
      resources:
        limits:
          memory: 1G

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: fiberloop-prometheus-staging
    restart: unless-stopped
    networks:
      - fiberloop-network
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data_staging:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: fiberloop-grafana-staging
    restart: unless-stopped
    networks:
      - fiberloop-network
    volumes:
      - grafana_data_staging:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_password_change_me
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false

  # Log aggregation - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: fiberloop-elasticsearch-staging
    restart: unless-stopped
    networks:
      - fiberloop-network
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.authc.api_key.enabled=true
      - ELASTIC_PASSWORD=elasticsearch_password_change_me
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data_staging:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Log aggregation - Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: fiberloop-kibana-staging
    restart: unless-stopped
    networks:
      - fiberloop-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=elasticsearch_password_change_me

networks:
  fiberloop-network:
    driver: bridge

volumes:
  postgres_data_staging:
  redis_data_staging:
  prometheus_data_staging:
  grafana_data_staging:
  elasticsearch_data_staging:
