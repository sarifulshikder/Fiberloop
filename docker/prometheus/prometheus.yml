global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'laravel-app'
    static_configs:
      - targets: ['app:9000']
    metrics_path: '/metrics'

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'

  - job_name: 'freeradius'
    static_configs:
      - targets: ['freeradius:18120']

  - job_name: 'queue'
    static_configs:
      - targets: ['queue:9000']

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai:8001']
    metrics_path: '/metrics'

  - job_name: 'reverb'
    static_configs:
      - targets: ['reverb:8080']
    metrics_path: '/metrics'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

# Alert rules for critical services
rule_files:
  - /etc/prometheus/alert_rules.yml
