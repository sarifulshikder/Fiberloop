input {
  # Listen for Laravel application logs via filebeat or direct UDP
  beats {
    port => 5044
    type => "laravel"
  }

  # Listen for Nginx logs
  file {
    path => ["/var/log/nginx/access.log", "/var/log/nginx/error.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["nginx"]
    type => "nginx"
  }

  # Listen for PHP-FPM logs
  file {
    path => ["/var/log/php*.log", "/var/log/php-fpm.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["php"]
    type => "php"
  }

  # Listen for PostgreSQL logs
  file {
    path => ["/var/log/postgresql/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["postgres"]
    type => "postgres"
  }

  # Listen for Redis logs
  file {
    path => ["/var/log/redis/redis-server.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["redis"]
    type => "redis"
  }

  # Listen for FreeRADIUS logs
  file {
    path => ["/var/log/freeradius/radius.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["radius"]
    type => "radius"
  }

  # Listen for queue worker logs
  file {
    path => ["/var/www/html/storage/logs/horizon.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["queue", "horizon"]
    type => "queue"
  }

  # Listen for general Laravel logs
  file {
    path => ["/var/www/html/storage/logs/laravel.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["laravel"]
    type => "laravel"
  }
}

filter {
  # Parse Nginx access logs
  if [type] == "nginx" {
    grok {
      match => { "message" => "%{IPORHOST:client_ip} - %{USER:remote_user} \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code} %{NUMBER:bytes_sent} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
  }

  # Parse Laravel log format
  if [type] == "laravel" {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{LOGLEVEL:log_level}: %{GREEDYDATA:log_message}" }
    }
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }

    # Parse stack traces
    if "Stack trace:" in [log_message] {
      grok {
        match => { "log_message" => "%{GREEDYDATA:error_message}\\nStack trace:\\n%{GREEDYDATA:stack_trace}" }
      }
    }

    # Extract context data
    json {
      source => "log_message"
      target => "laravel_context"
      skip_on_invalid_json => true
    }
  }

  # Parse PostgreSQL logs
  if [type] == "postgres" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{IPORHOST:client_ip} %{USER:db_user} %{DATA:db_name} %{GREEDYDATA:query}" }
    }
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }
  }

  # Parse FreeRADIUS logs
  if [type] == "radius" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} : %{LOGLEVEL:log_level} : %{GREEDYDATA:radius_message}" }
    }
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }

    # Extract RADIUS-specific fields
    if "Auth:" in [radius_message] {
      grok {
        match => { "radius_message" => "Auth: %{GREEDYDATA:auth_details}" }
      }
    }
  }

  # Parse queue logs
  if [type] == "queue" {
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{LOGLEVEL:log_level}: %{GREEDYDATA:queue_message}" }
    }
    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss"]
      target => "@timestamp"
    }

    # Extract job information
    if "Job" in [queue_message] {
      grok {
        match => { "queue_message" => "%{DATA:job_class} \\{%{DATA:job_id}\\}" }
      }
    }
  }

  # Add environment field
  mutate {
    add_field => { "environment" => "%{HOSTNAME}" }
  }

  # Add application field based on source
  mutate {
    add_field => {
      "application" => "%{[type]}"
    }
  }

  # GeoIP lookup for client IPs
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # User agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "user_agent"
    }
  }

  # Parse HTTP status codes
  if [status_code] {
    if [status_code] >= 500 {
      mutate { add_tag => ["error_5xx"] }
    } else if [status_code] >= 400 {
      mutate { add_tag => ["error_4xx"] }
    } else if [status_code] >= 300 {
      mutate { add_tag => ["redirect"] }
    } else {
      mutate { add_tag => ["success"] }
    }
  }

  # Parse log levels
  if [log_level] {
    if [log_level] == "ERROR" or [log_level] == "CRITICAL" or [log_level] == "ALERT" or [log_level] == "EMERGENCY" {
      mutate { add_tag => ["error"] }
    } else if [log_level] == "WARNING" or [log_level] == "WARN" {
      mutate { add_tag => ["warning"] }
    } else if [log_level] == "INFO" {
      mutate { add_tag => ["info"] }
    } else if [log_level] == "DEBUG" {
      mutate { add_tag => ["debug"] }
    }
  }

  # Add severity based on log level
  mutate {
    add_field => {
      "severity" => "%{[log_level]}"
    }
  }

  # Remove temporary fields
  mutate {
    remove_field => ["timestamp", "message"]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "fiberloop-logs-%{+YYYY.MM.dd}"
    document_type => "%{type}"
  }

  # Also send to stdout for debugging
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
