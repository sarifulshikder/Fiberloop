# Client definitions for FreeRADIUS
# This file is included by radiusd.conf

# Localhost client for testing
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nastype = other
}

# Docker network - allow connections from the fiberloop-network
# NAS clients will be added dynamically from Laravel, but we need
# a base configuration for the app container to send CoA requests
client fiberloop-app {
    ipaddr = 172.20.0.0/16
    secret = changeme_in_production
    require_message_authenticator = no
    nastype = other
}
