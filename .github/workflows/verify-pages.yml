name: Verify All Pages

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2 AM UTC

jobs:
  test:
    name: "Test & Verify (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: fiberloop
          POSTGRES_DB: fiberloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype, fileinfo, tokenizer, pdo_pgsql, bcmath, dom, gd, json, mbstring
          coverage: none
          ini-values: memory_limit=2G

      - name: Install dependencies
        run: |
          composer install -n --prefer-dist --no-interaction --no-progress
          npm install --prefer-offline --no-audit
          npm run build --if-present

      - name: Run database migrations & seeders
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fiberloop_test
          DB_USERNAME: fiberloop
          DB_PASSWORD: secret
          APP_ENV: testing
        run: |
          php artisan migrate:fresh --seed --force --no-interaction
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear

      - name: Run PHPStan (Static Analysis)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --memory-limit=2G --no-progress || true
          else
            echo "PHPStan not installed, skipping..."
          fi

      - name: Run Pest HTTP Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fiberloop_test
          DB_USERNAME: fiberloop
          DB_PASSWORD: secret
        run: |
          php artisan test --filter=FullProjectVerificationTest --no-coverage || true

      - name: Run All Routes Test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fiberloop_test
          DB_USERNAME: fiberloop
          DB_PASSWORD: secret
        run: |
          php artisan test --filter=AllRoutesTest --no-coverage --timeout=300 || true

      - name: Run Custom Verification Command
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fiberloop_test
          DB_USERNAME: fiberloop
          DB_PASSWORD: secret
        run: |
          php artisan app:verify-all-pages --user=1 --customer=6 || true

      - name: Check for errors in logs
        run: |
          if [ -f storage/logs/laravel.log ]; then
            ERRORS=$(grep -c -E "ERROR|Exception|BadMethodCall|TypeError|Undefined" storage/logs/laravel.log || echo "0")
            if [ "$ERRORS" -gt "0" ]; then
              echo "::error::Found $ERRORS errors in application logs"
              tail -n 50 storage/logs/laravel.log | grep -E "ERROR|Exception|BadMethodCall|TypeError|Undefined"
              exit 1
            else
              echo "✓ No errors found in logs"
            fi
          else
            echo "No log file found"
          fi

  dusk:
    name: Browser Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'schedule' # Skip Dusk on scheduled runs for speed
    
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_USER: fiberloop
          POSTGRES_DB: fiberloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, ctype, fileinfo, tokenizer, pdo_pgsql, bcmath, dom, gd

      - name: Install dependencies
        run: |
          composer install -n --prefer-dist
          npm install
          npm run build

      - name: Prepare Laravel Dusk
        run: |
          php artisan dusk:install --detect

      - name: Start ChromeDriver
        run: |
          google-chrome --version
          chromedriver --version
          Xvfb :99 -screen 0 1280x800x16 & export DISPLAY=:99
          chromedriver --port=4444 --url-base=/wd/hub &
          sleep 5

      - name: Run database migrations & seeders
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fiberloop_test
          DB_USERNAME: fiberloop
          DB_PASSWORD: secret
        run: |
          php artisan migrate:fresh --seed --force

      - name: Run Dusk tests
        env:
          APP_URL: http://127.0.0.1:8000
          DUSK_DRIVER_URL: http://127.0.0.1:4444/wd/hub
        run: |
          php artisan serve --port=8000 --host=0.0.0.0 &
          sleep 10
          php artisan dusk tests/Browser/FullApplicationTest.php || true
          pkill -f "php artisan serve" || true
