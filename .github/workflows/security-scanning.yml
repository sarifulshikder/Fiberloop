name: Security Scanning

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, redis, mbstring, fileinfo, tokenizer, ctype

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run Composer Audit
        run: |
          # Run composer audit to check for vulnerable dependencies
          composer audit --format=json > composer-audit-results.json || true
          
          # Check if there are vulnerabilities
          VULNERABILITIES=$(jq '.vulnerabilities | length' composer-audit-results.json)
          
          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "::error::Found $VULNERABILITIES vulnerabilities in dependencies"
            jq '.vulnerabilities' composer-audit-results.json
            exit 1
          else
            echo "✓ No vulnerabilities found in dependencies"
          fi
        continue-on-error: false

      - name: Upload Composer Audit Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: composer-audit-results
          path: composer-audit-results.json

  code-analysis:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    needs: dependency-audit
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run security audit
        run: |
          # Enable query logging for security audit
          php artisan security:audit --full
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/test.db

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to scan full history

      - name: Run TruffleHog for secrets scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

      - name: Run Gitleaks for secrets scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          # Gitleaks will fail if secrets are found

  security-headers:
    name: Security Headers Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check security headers
        run: |
          # This would normally test a live deployment
          # For now, we'll just check that security middleware is properly configured
          echo "✓ Security middleware check would run against live deployment"
          
          # Check that HSTS middleware exists
          if [ -f "app/Http/Middleware/EnforceHttps.php" ]; then
            echo "✓ HSTS middleware exists"
          else
            echo "::warning::HSTS middleware not found"
          fi
          
          # Check that KYC middleware exists
          if [ -f "app/Http/Middleware/RestrictKycAccess.php" ]; then
            echo "✓ KYC access restriction middleware exists"
          else
            echo "::warning::KYC access restriction middleware not found"
          fi
          
          # Check that rate limiting middleware exists
          if [ -f "app/Http/Middleware/ApiRateLimitMiddleware.php" ]; then
            echo "✓ API rate limiting middleware exists"
          else
            echo "::warning::API rate limiting middleware not found"
          fi
